<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>삼여회 독서모임 자료실</title>

<meta property="og:type" content="website">
<meta property="og:title" content="삼여회 독서모임 자료실">
<meta property="og:description" content="꽃초롱 작은도서관 삼여회 독서모임 읽기 자료 모음">
<meta property="og:url" content="https://minfore-crypto.github.io/samyeohoe/">
<style>
:root{--bg:#f6f3ec;--panel:#fffdf8;--ink:#2b2620;--ink-soft:#6b6055;--line:#c9bda9;--accent:#8c5a2b;--edge:#ded3c0;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1815;--panel:#242019;--ink:#ece5d8;--ink-soft:#a89880;--line:#544a3c;--accent:#d9a35e;--edge:#40382d;}}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;
 font-family:"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.wrap{max-width:680px;margin:0 auto;padding:56px 24px 80px;}
h1{font-family:"Apple SD Gothic Neo","Nanum Myeongjo","Batang",serif;font-size:clamp(26px,5vw,34px);
 margin:0 0 6px;letter-spacing:-.02em;}
.sub{color:var(--ink-soft);font-size:15px;margin:0 0 36px;}
.rule{height:1px;background:var(--line);opacity:.6;margin:0 0 28px;}
a.item{display:block;text-decoration:none;color:inherit;background:var(--panel);
 border:1px solid var(--edge);border-radius:12px;padding:16px 18px;margin-bottom:12px;}
a.item:hover{border-color:var(--accent);}
.it{font-weight:700;font-size:17px;letter-spacing:-.01em;}
.id{font-size:13.5px;color:var(--ink-soft);margin-top:4px;}
.im{font-size:11.5px;color:var(--accent);font-weight:600;letter-spacing:.04em;margin-bottom:5px;}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--edge);
 font-size:12.5px;color:var(--ink-soft);text-align:center;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
<h1>삼여회 독서모임 자료실</h1>
<p class="sub">꽃초롱 작은도서관 · 모임에서 만든 읽기 자료를 모아둡니다.</p>
<div class="rule"></div>

<a class="item" href="first-year/">
  <div class="im">1주년 · 2026. 10</div>
  <div class="it">삼여회 첫 해 — 신화를 읽은 스물여섯 번의 일요일 아침</div>
  <div class="id">한 해의 여정 · 회차별 이야기 갈래 · 함께한 사람들 · 자꾸 돌아간 질문. 활동일지 1~26차 바탕.</div>
</a>

<a class="item" href="gilgamesh/">
  <div class="im">23차 모임</div>
  <div class="it">길가메쉬 서사시 인물 계보</div>
  <div class="id">신들의 계보 · 길가메쉬 가계 · 인물 관계 지도 · 신들은 언제 등장하는가. 김산해 옮김 통합본 기준.</div>
</a>

<footer>휴대폰에서도 볼 수 있습니다. 링크를 저장해두세요.</footer>
</div>
</body>
</html>
